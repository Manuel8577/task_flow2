
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Flow | Nueva tarea</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
            font-family: 'Segoe UI', sans-serif;
            color: #202b3c;
        }

        .form-container {
            max-width: 750px;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(7, 33, 71, 0.07);
        }

        .form-control, .form-select {
            padding: 12px;
            border-radius: 9px;
            border-color: #e1e6ef;
        }

        .form-control:focus, .form-select:focus {
            border-color: #1d5eeb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .1);
        }

        .btn-primary {
            background: #2563eb;
            border: none;
            padding: 11px 20px;
            border-radius: 9px;
        }

        .subtitle {
            color: #8995a8;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form-container">

        <a href="/" class="text-decoration-none text-secondary">
            <i class="bi bi-arrow-left me-2"></i>
            Volver al panel
        </a>

        <div class="mt-4 mb-4">
            <h2 class="fw-bold">
                <i class="bi bi-plus-circle text-primary me-2"></i>
                Crear nueva tarea
            </h2>

            <p class="subtitle">
                Completa la información para registrar una nueva tarea.
            </p>
        </div>

        <form method="POST" action="{{ url_for('crear_tarea_web') }}">

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Nombre de la tarea
                </label>

                <input
                    type="text"
                    name="titulo"
                    class="form-control"
                    placeholder="Ej. Diseñar página principal"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Descripción
                </label>

                <textarea
                    name="descripcion"
                    class="form-control"
                    rows="3"
                    placeholder="Describe brevemente la tarea..."
                ></textarea>
            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">
                        Fecha límite
                    </label>

                    <input
                        type="date"
                        name="fecha_limite"
                        class="form-control"
                        required
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">
                        Prioridad
                    </label>

                    <select name="prioridad" class="form-select" required>
                        <option value="">Selecciona prioridad</option>
                        <option value="Alta">Alta</option>
                        <option value="Media">Media</option>
                        <option value="Baja">Baja</option>
                    </select>
                </div>

            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Proyecto
                </label>

                <select name="proyecto_id" class="form-select" required>

                    {% for proyecto in proyectos %}

                    <option value="{{ proyecto.id }}">
                        {{ proyecto.nombre }}
                    </option>

                    {% endfor %}

                </select>
            </div>

            <div class="d-flex justify-content-end gap-2">

                <a href="/" class="btn btn-light border">
                    Cancelar
                </a>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-2"></i>
                    Guardar tarea
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
